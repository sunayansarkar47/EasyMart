<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-deep:  #0a3d1f;
      --green-mid:   #0f5c30;
      --green-vivid: #16a34a;
      --green-light: #22c55e;
      --cream:       #f5f0e8;
      --gold:        #d4a843;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--green-deep);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--green-light); top: -100px; left: -100px; animation: drift 14s ease-in-out infinite; }
    .blob-2 { width: 380px; height: 380px; background: var(--gold);        bottom: -80px; right: -80px;   animation: drift 18s ease-in-out infinite reverse; }

    @keyframes drift {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%       { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Splash card */
    .splash {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeUp 1s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tagline-top {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeIn 0.8s 0.4s ease forwards;
      margin-bottom: 18px;
    }

    /* Logo wordmark */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: scaleIn 0.9s 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--green-vivid), var(--green-light));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 40px rgba(34,197,94,0.4);
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 3.6rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--green-light);
    }

    .tagline-bottom {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.12em;
      margin-top: 14px;
      opacity: 0;
      animation: fadeIn 0.8s 1.1s ease forwards;
    }

    /* Divider line */
    .divider {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 24px 0 28px;
      animation: expandW 0.8s 1.4s ease forwards;
    }

    @keyframes expandW {
      to { width: 240px; }
    }

    /* Loader bar */
    .loader-track {
      width: 220px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.5s 1.6s ease forwards;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green-vivid), var(--green-light), var(--gold));
      border-radius: 99px;
      animation: loadProgress 2.2s 1.7s ease forwards;
    }

    @keyframes loadProgress {
      0%   { width: 0%; }
      60%  { width: 70%; }
      100% { width: 100%; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="splash">
    <p class="tagline-top">Welcome to</p>

    <div class="logo-wrap">
      <div class="logo-icon">🛒</div>
      <div class="logo-text">Easy<span>Mart</span></div>
    </div>

    <p class="tagline-bottom">Shop smart · Shop local</p>

    <div class="divider"></div>
    <div class="loader-track"><div class="loader-bar"></div></div>
  </div>

  <script>
    // Redirect after splash finishes (~4s total)
    setTimeout(() => {
      window.location.href = "landing.html";
    }, 4000);
  </script>
</body>
</html>
