<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="checkout-container">

    <h2>🔒 Secure Checkout</h2>

    <!-- Order Summary -->
    <div class="order-box">
        <p>Smart Watch</p>
        <span>৳2,500</span>
    </div>

    <!-- Payment -->
    <div class="payment-box">
        <h4>Select Payment Method</h4>

        <div class="payment-option" onclick="selectPayment('cod', this)">
            <img src="https://img.icons8.com/ios-filled/50/cash.png">
            <span>Cash on Delivery</span>
            <input type="radio" name="payment" id="cod">
        </div>

        <div class="payment-option" onclick="selectPayment('bkash', this)">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/BKash_Logo.svg/320px-BKash_Logo.svg.png">
            <span>bKash</span>
            <input type="radio" name="payment" id="bkash">
        </div>

        <div class="payment-option" onclick="selectPayment('nagad', this)">
            <img src="https://download.logo.wine/logo/Nagad/Nagad-Logo.wine.png">
            <span>Nagad</span>
            <input type="radio" name="payment" id="nagad">
        </div>

        <div class="payment-option" onclick="selectPayment('card', this)">
            <img src="https://img.icons8.com/color/48/bank-card-back-side.png">
            <span>Credit / Debit Card</span>
            <input type="radio" name="payment" id="card">
        </div>

    </div>

    <!-- Dynamic Fields -->
    <div id="payment-details"></div>

    <button class="pay-btn" onclick="confirmOrder()">Confirm Payment</button>

    <p id="message"></p>

</div>

<script src="script.js"></script>
</body>
</html>
