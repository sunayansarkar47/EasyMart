<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyMart – Shop Rating</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
/* ===== VARIABLES ===== */
:root {
  --green: #08532c;
  --green-mid: #0a7a40;
  --green-light: #16a34a;
  --green-pale: #e8f5ee;
  --accent: #f59e0b;
  --accent-pale: #fef9ec;
  --red: #ef4444;
  --blue: #3b82f6;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --white: #ffffff;
  --bg: #f0fdf4;
  --shadow: 0 8px 32px rgba(8,83,44,0.10);
  --shadow-lg: 0 20px 60px rgba(8,83,44,0.14);
}

/* ===== RESET ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ===== NAVBAR ===== */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 6%;
  background: var(--green);
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

.logo {
  font-size: 1.5rem;
  font-weight: 900;
  color: white;
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}

.nav-links {
  display: flex;
  gap: 6px;
}

.nav-links a {
  padding: 8px 18px;
  border-radius: 20px;
  color: #c9dfd1;
  font-weight: 700;
  font-size: 0.95rem;
  text-decoration: none;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-links a:hover,
.nav-links a.active {
  background: rgba(255,255,255,0.15);
  color: white;
}

/* ===== HERO BANNER ===== */
.rating-hero {
  background: linear-gradient(135deg, var(--green) 0%, var(--green-mid) 50%, var(--green-light) 100%);
  padding: 60px 6%;
  position: relative;
  overflow: hidden;
  color: white;
}

.hero-bg-circles span {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
}

.hero-bg-circles span:nth-child(1) {
  width: 380px; height: 380px;
  top: -120px; right: -60px;
}

.hero-bg-circles span:nth-child(2) {
  width: 220px; height: 220px;
  bottom: -80px; left: 10%;
}

.hero-bg-circles span:nth-child(3) {
  width: 140px; height: 140px;
  top: 30px; left: 40%;
}

.hero-content {
  display: flex;
  align-items: center;
  gap: 60px;
  position: relative;
  z-index: 1;
  flex-wrap: wrap;
}

.overall-score {
  text-align: center;
  min-width: 160px;
}

.big-score {
  font-family: 'Playfair Display', serif;
  font-size: 5.5rem;
  font-weight: 900;
  line-height: 1;
  color: white;
  text-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.big-stars {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin: 10px 0 8px;
  font-size: 1.4rem;
}

.big-stars .fa-star { color: var(--accent); }
.big-stars .fa-star-half-alt { color: var(--accent); }
.big-stars .fa-star.empty { color: rgba(255,255,255,0.3); }

.score-label {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.8);
  font-weight: 600;
  letter-spacing: 0.5px;
}

.total-reviews {
  margin-top: 8px;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* Score Breakdown Bars */
.score-breakdown {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 260px;
}

.breakdown-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.breakdown-label {
  font-size: 0.88rem;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  width: 28px;
  text-align: right;
  display: flex;
  align-items: center;
  gap: 3px;
}

.breakdown-label i { font-size: 0.75rem; color: var(--accent); }

.bar-track {
  flex: 1;
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 20px;
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
}

.breakdown-count {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.7);
  width: 28px;
}

/* ===== MAIN WRAP ===== */
.main-wrap {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 5%;
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 30px;
  align-items: start;
}

/* ===== REVIEW FORM CARD ===== */
.review-form-card {
  background: white;
  border-radius: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
  position: sticky;
  top: 80px;
}

.form-header {
  background: linear-gradient(90deg, var(--green), var(--green-light));
  padding: 22px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.form-header i {
  font-size: 1.8rem;
  color: rgba(255,255,255,0.85);
}

.form-header h2 {
  font-size: 1.25rem;
  font-weight: 900;
  color: white;
}

.form-header p {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.75);
  margin-top: 2px;
}

.form-body {
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.input-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.input-group label {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--text);
}

.input-group input,
.input-group textarea {
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 0.95rem;
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  outline: none;
  transition: 0.25s;
  background: #f8fafc;
}

.input-group input:focus,
.input-group textarea:focus {
  border-color: var(--green);
  background: white;
  box-shadow: 0 0 0 4px rgba(8,83,44,0.07);
}

.input-group textarea {
  height: 90px;
  resize: none;
}

/* Star Picker */
.star-picker {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

.star-picker span {
  font-size: 2rem;
  color: #e2e8f0;
  cursor: pointer;
  transition: 0.15s;
  line-height: 1;
}

.star-picker span:hover,
.star-picker span.active {
  color: var(--accent);
  transform: scale(1.2);
}

.rating-label {
  font-size: 0.82rem;
  color: var(--muted);
  font-weight: 600;
}

/* Category Pills */
.category-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.category-pills span {
  padding: 7px 14px;
  border-radius: 20px;
  background: var(--bg);
  border: 2px solid var(--border);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
  color: var(--muted);
}

.category-pills span:hover {
  border-color: var(--green);
  color: var(--green);
  background: var(--green-pale);
}

.category-pills span.selected {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

/* Submit Button */
.submit-btn {
  padding: 14px;
  background: linear-gradient(90deg, var(--green), var(--green-light));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 800;
  font-family: 'Nunito', sans-serif;
  cursor: pointer;
  transition: 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.submit-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(8,83,44,0.3);
}

.submit-btn:active { transform: scale(0.98); }

/* ===== REVIEWS PANEL ===== */
.reviews-panel {
  background: white;
  border-radius: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.panel-top {
  padding: 22px 28px 16px;
  border-bottom: 2px solid var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.panel-top h2 {
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-bar {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid var(--border);
  background: white;
  font-size: 0.8rem;
  font-weight: 700;
  font-family: 'Nunito', sans-serif;
  cursor: pointer;
  color: var(--muted);
  transition: 0.2s;
}

.filter-btn:hover {
  border-color: var(--green);
  color: var(--green);
}

.filter-btn.active {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

/* Reviews List */
.reviews-list {
  padding: 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 680px;
  overflow-y: auto;
}

.reviews-list::-webkit-scrollbar { width: 5px; }
.reviews-list::-webkit-scrollbar-track { background: var(--bg); }
.reviews-list::-webkit-scrollbar-thumb { background: #b7ddc8; border-radius: 10px; }

/* Review Card */
.review-card {
  background: #f8fafc;
  border-radius: 16px;
  padding: 18px 20px;
  border-left: 4px solid var(--green);
  transition: 0.25s;
  animation: slideIn 0.4s ease forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.review-card:hover {
  transform: translateX(4px);
  box-shadow: 0 4px 16px rgba(8,83,44,0.08);
}

.review-card.low-rating { border-left-color: var(--red); }
.review-card.mid-rating { border-left-color: var(--accent); }

.review-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.reviewer-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  font-weight: 900;
  color: white;
  flex-shrink: 0;
}

.reviewer-name {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--text);
}

.reviewer-area {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.review-stars {
  display: flex;
  gap: 3px;
  font-size: 0.9rem;
}

.review-stars .fa-star { color: var(--accent); }
.review-stars .fa-star.empty { color: #e2e8f0; }

.review-text {
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 10px;
}

.review-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.review-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag {
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--green-pale);
  color: var(--green);
  font-size: 0.75rem;
  font-weight: 700;
}

.review-date {
  font-size: 0.76rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

.helpful-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 700;
  font-family: 'Nunito', sans-serif;
  color: var(--muted);
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.helpful-btn:hover {
  border-color: var(--green);
  color: var(--green);
  background: var(--green-pale);
}

.helpful-btn.liked {
  background: var(--green-pale);
  border-color: var(--green);
  color: var(--green);
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}

.empty-state i { font-size: 3rem; margin-bottom: 12px; color: #c9dfd1; }
.empty-state p { font-size: 1rem; font-weight: 700; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--green);
  color: white;
  padding: 14px 28px;
  border-radius: 40px;
  font-size: 0.95rem;
  font-weight: 700;
  z-index: 999;
  transition: 0.4s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 8px 28px rgba(8,83,44,0.35);
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
  pointer-events: none;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }
.toast.warn { background: var(--accent); }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .main-wrap {
    grid-template-columns: 1fr;
  }

  .review-form-card { position: static; }

  .hero-content { flex-direction: column; align-items: flex-start; gap: 30px; }

  .score-breakdown { width: 100%; }
}

@media (max-width: 480px) {
  .input-row { grid-template-columns: 1fr; }

  .big-score { font-size: 4rem; }

  .panel-top { flex-direction: column; align-items: flex-start; }
}
  </style>
</head>

<!-- NAVBAR -->

    <div class="form-body">
      <div class="input-row">
        <div class="input-group">

        </div>
        <div class="input-group">
          <label>এলাকা</label>
          <input type="text" id="reviewerArea" placeholder="যেমন: নাটোর">

      <div class="input-group">
        <label>রেটিং দিন</label>

        <span class="rating-label" id="ratingLabel">রেটিং বেছে নিন</span>
      </div>

      <div class="input-group">
        <label>ক্যাটাগরি</label>
        <div class="category-pills" id="categoryPills">

      <div class="input-group">
        <label>মন্তব্য</label>
        <textarea id="reviewText" placeholder="আপনার অভিজ্ঞতা লিখুন..."></textarea>
      </div>

      <button class="submit-btn" onclick="submitReview()">
        <i class="fas fa-paper-plane"></i> রিভিউ জমা দিন
      </button>
    </div>
  </div>

  <!-- FILTER + REVIEWS -->
  <div class="reviews-panel">
    <div class="panel-top">
      <h2><i class="fas fa-comments"></i> সকল রিভিউ</h2>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="filterReviews('all', this)">সব</button>
        <button class="filter-btn" data-filter="5" onclick="filterReviews('5', this)">⭐⭐⭐⭐⭐</button>
        <button class="filter-btn" data-filter="4" onclick="filterReviews('4', this)">⭐⭐⭐⭐</button>
        <button class="filter-btn" data-filter="3" onclick="filterReviews('3', this)">⭐⭐⭐</button>
        <button class="filter-btn" data-filter="low" onclick="filterReviews('low', this)">১-২ ⭐</button>
      </div>
    </div>

    <div class="reviews-list" id="reviewsList">
      <!-- filled by JS -->
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastMsg"></span>
</div>

    area: "সিংড়া",
    rating: 3,
    text: "পণ্য ঠিকঠাক ছিল কিন্তু ডেলিভারি একটু দেরি হয়েছিল। তবে কাস্টমার কেয়ার সাথে সাথে জবাব দিয়েছে।",
    categories: ["delivery", "service"],
    date: "২০২৫-০৪-২০",
    helpful: 4,
    liked: false,
    avatar: "#f59e0b",
  },
  {
    id: 5,
    name: "নাজমা খানম",
    area: "লালপুর",
    rating: 5,
    text: "প্রতি সপ্তাহে অর্ডার করি। দাম সাশ্রয়ী, পণ্য ফ্রেশ। EasyMart আমার পরিবারের পছন্দের দোকান।",
    categories: ["quality", "price", "service"],
    date: "২০২৫-০৪-১৮",
    helpful: 22,
    liked: false,
    avatar: "#7c3aed",
  },
  {
    id: 6,
    name: "রফিকুল ইসলাম",
    area: "নাটোর",
    rating: 2,
    text: "গত অর্ডারে একটি পণ্য মেয়াদ উত্তীর্ণ ছিল। সাপোর্টে জানিয়েছি, রিফান্ড পেয়েছি। আশা করি আর হবে না।",
    categories: ["quality"],
    date: "২০২৫-০৪-১৫",
    helpful: 9,
    liked: false,
    avatar: "#ef4444",
  },
];

let selectedRating = 0;
let selectedCategories = [];

// ---- Avatar colors ----
const avatarColors = [
  "#08532c","#0a7a40","#16a34a","#f59e0b",
  "#3b82f6","#7c3aed","#ef4444","#10b981","#ec4899"
];

// ---- Bangla category map ----
const catLabels = {
  delivery: "🛵 ডেলিভারি",
  quality: "🥦 পণ্য মান",
  price: "💰 দাম",
  service: "🤝 সেবা",
  packaging: "📦 প্যাকেজিং"
};

// ---- Rating label texts ----
const ratingTexts = ["", "😞 খুব খারাপ", "😐 খারাপ", "🙂 মোটামুটি", "😊 ভালো", "🤩 অসাধারণ!"];

// ============================================================
// INIT
// ============================================================
document.addEventListener("DOMContentLoaded", () => {
  initStarPicker();
  initCategoryPills();
  renderReviews(reviews);
  updateHeroStats();
});

// ============================================================
// STAR PICKER
// ============================================================
function initStarPicker() {
  const stars = document.querySelectorAll("#starPicker span");

  stars.forEach((star) => {
    star.addEventListener("mouseenter", () => highlightStars(+star.dataset.val));
    star.addEventListener("mouseleave", () => highlightStars(selectedRating));
    star.addEventListener("click", () => {
      selectedRating = +star.dataset.val;
      highlightStars(selectedRating);
      document.getElementById("ratingLabel").textContent = ratingTexts[selectedRating];
    });
  });
}

function highlightStars(count) {
  document.querySelectorAll("#starPicker span").forEach((s) => {
    s.classList.toggle("active", +s.dataset.val <= count);
  });
}

// ============================================================
// CATEGORY PILLS
// ============================================================
function initCategoryPills() {
  document.querySelectorAll("#categoryPills span").forEach((pill) => {
    pill.addEventListener("click", () => {
      const cat = pill.dataset.cat;
      if (selectedCategories.includes(cat)) {
        selectedCategories = selectedCategories.filter((c) => c !== cat);
        pill.classList.remove("selected");
      } else {
        selectedCategories.push(cat);
        pill.classList.add("selected");
      }
    });
  });
}

// ============================================================
// SUBMIT REVIEW
// ============================================================
function submitReview() {
  const name = document.getElementById("reviewerName").value.trim();
  const area = document.getElementById("reviewerArea").value.trim();
  const text = document.getElementById("reviewText").value.trim();

  if (!name) { showToast("⚠️ আপনার নাম লিখুন", "warn"); return; }
  if (!selectedRating) { showToast("⚠️ রেটিং বেছে নিন", "warn"); return; }
  if (!text) { showToast("⚠️ মন্তব্য লিখুন", "warn"); return; }

  const newReview = {
    id: Date.now(),
    name,
    area: area || "অজানা এলাকা",
    rating: selectedRating,
    text,
    categories: [...selectedCategories],
    date: todayBangla(),
    helpful: 0,
    liked: false,
    avatar: avatarColors[Math.floor(Math.random() * avatarColors.length)],
  };

  reviews.unshift(newReview);
  renderReviews(reviews);
  updateHeroStats();
  resetForm();
  showToast("✅ আপনার রিভিউ যোগ হয়েছে! ধন্যবাদ");
}

function resetForm() {
  document.getElementById("reviewerName").value = "";
  document.getElementById("reviewerArea").value = "";
  document.getElementById("reviewText").value = "";
  selectedRating = 0;
  selectedCategories = [];
  highlightStars(0);
  document.getElementById("ratingLabel").textContent = "রেটিং বেছে নিন";
  document.querySelectorAll("#categoryPills span").forEach((p) => p.classList.remove("selected"));
}

// ============================================================
// RENDER REVIEWS
// ============================================================
function renderReviews(list) {
  const container = document.getElementById("reviewsList");

  if (!list.length) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-comment-slash"></i>
        <p>কোনো রিভিউ পাওয়া যায়নি</p>
      </div>`;
    return;
  }

  container.innerHTML = list.map((r) => buildReviewCard(r)).join("");
}

function buildReviewCard(r) {
  const stars = buildStars(r.rating);
  const initials = r.name.charAt(0);
  const borderClass = r.rating <= 2 ? "low-rating" : r.rating === 3 ? "mid-rating" : "";
  const tags = r.categories.map((c) => `<span class="tag">${catLabels[c] || c}</span>`).join("");

  return `
    <div class="review-card ${borderClass}" id="rc-${r.id}">
      <div class="review-top">
        <div class="reviewer-info">
          <div class="avatar" style="background:${r.avatar}">${initials}</div>
          <div>
            <div class="reviewer-name">${r.name}</div>
            <div class="reviewer-area"><i class="fas fa-map-marker-alt"></i>${r.area}</div>
          </div>
        </div>
        <div class="review-stars">${stars}</div>
      </div>
      <p class="review-text">${r.text}</p>
      <div class="review-footer">
        <div class="review-tags">${tags}</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span class="review-date"><i class="fas fa-clock"></i>${r.date}</span>
          <button class="helpful-btn ${r.liked ? "liked" : ""}" onclick="toggleHelpful(${r.id})">
            <i class="fas fa-thumbs-up"></i> সহায়ক (${r.helpful})
          </button>
        </div>
      </div>
    </div>`;
}

function buildStars(n) {
  let s = "";
  for (let i = 1; i <= 5; i++) {
    s += i <= n
      ? `<i class="fas fa-star"></i>`
      : `<i class="fas fa-star empty"></i>`;
  }
  return s;
}

// ============================================================
// HELPFUL TOGGLE
// ============================================================
function toggleHelpful(id) {
  const r = reviews.find((x) => x.id === id);
  if (!r) return;
  if (r.liked) {
    r.helpful--;
    r.liked = false;
  } else {
    r.helpful++;
    r.liked = true;
  }
  // Re-render only that card
  const card = document.getElementById(`rc-${id}`);
  if (card) card.outerHTML = buildReviewCard(r);
}

// ============================================================
// FILTER
// ============================================================
function filterReviews(type, btn) {
  document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");

  let filtered;
  if (type === "all") {
    filtered = reviews;
  } else if (type === "low") {
    filtered = reviews.filter((r) => r.rating <= 2);
  } else {
    filtered = reviews.filter((r) => r.rating === +type);
  }
  renderReviews(filtered);
}

// ============================================================
// HERO STATS
// ============================================================
function updateHeroStats() {
  if (!reviews.length) return;

  const avg = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
  document.getElementById("bigScore").textContent = avg.toFixed(1);
  document.getElementById("totalReviews").textContent = reviews.length;

  // Big stars
  const bigStars = document.getElementById("bigStars");
  bigStars.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const ic = document.createElement("i");
    if (i <= Math.floor(avg)) {
      ic.className = "fas fa-star";
    } else if (i - avg < 1 && avg % 1 >= 0.3) {
      ic.className = "fas fa-star-half-alt";
    } else {
      ic.className = "fas fa-star empty";
    }
    bigStars.appendChild(ic);
  }

  // Breakdown bars
  const breakdown = document.getElementById("scoreBreakdown");
  breakdown.innerHTML = "";
  for (let star = 5; star >= 1; star--) {
    const count = reviews.filter((r) => r.rating === star).length;
    const pct = reviews.length ? (count / reviews.length) * 100 : 0;
    breakdown.innerHTML += `
      <div class="breakdown-row">
        <span class="breakdown-label">${star}<i class="fas fa-star"></i></span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
        <span class="breakdown-count">${count}</span>
      </div>`;
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = "") {
  const t = document.getElementById("toast");
  t.className = `toast ${type}`;
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3200);
}

// ============================================================
// HELPERS
// ============================================================
function todayBangla() {
  const d = new Date();
  const bn = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  const conv = (n) => String(n).split("").map((c) => bn[+c]).join("");
  return `${conv(d.getFullYear())}-${conv(String(d.getMonth()+1).padStart(2,"0"))}-${conv(String(d.getDate()).padStart(2,"0"))}`;
}
</script>
