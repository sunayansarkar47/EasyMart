<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EasyMart - Shopkeeper Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>EasyMart</h2>

    <button class="menu active">Dashboard</button>
    <button class="menu">Products</button>
    <button class="menu">Orders</button>
    <button class="menu">Profit</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

<header class="topbar">
  <h2>Shopkeeper Panel</h2>

  <div class="topbar-actions">
    <button id="addBtn">+ Add Product</button>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

    <!-- PROFIT BOX -->
    <div class="profit-box">
      Total Profit: $<span id="totalProfit">0</span>
    </div>

    <!-- PRODUCT LIST -->
    <div id="productList" class="product-grid"></div>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
