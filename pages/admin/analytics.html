<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics — EasyMart Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-depth="2">
<div class="dash-shell">
  <div id="sidebarHost"></div>
  <main class="dash-main">
    <div class="dash-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle js-menu-toggle">☰</button>
        <h1 class="display">Platform analytics</h1>
      </div>
    </div>

    <div class="stat-grid" id="statCards"></div>

    <div class="rg-21" style="margin-bottom:18px">
      <div class="dash-section">
        <h3>New registrations (last 7 days)</h3>
        <div class="chart-wrap"><canvas id="dualLine"></canvas></div>
      </div>
      <div class="dash-section">
        <h3>Category popularity</h3>
        <div class="chart-wrap"><canvas id="catDoughnut"></canvas></div>
      </div>
    </div>

    <div class="rg-2col" style="margin-bottom:18px">
      <div class="dash-section">
        <h3>Platform revenue per week</h3>
        <div class="chart-wrap"><canvas id="revBar"></canvas></div>
      </div>
      <div class="dash-section">
        <h3>Conversion funnel</h3>
        <div class="chart-wrap"><canvas id="funnelBar"></canvas></div>
      </div>
    </div>

    <div class="rg-2col">
      <div class="dash-section">
        <h3>Most searched terms</h3>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>#</th><th>Term</th><th>Searches</th></tr></thead>
          <tbody id="searchedBody"></tbody>
        </table></div>
      </div>
      <div class="dash-section">
        <h3>Most active locations</h3>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>#</th><th>Area</th><th>Activity</th></tr></thead>
          <tbody id="locBody"></tbody>
        </table></div>
      </div>
    </div>
  </main>
</div>

<script src="../../lib/chart.min.js"></script>
<script src="../../config.js"></script>
<script src="../../js/data.js"></script>
<script src="../../lib/supabase.js"></script>
<script src="../../js/db.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/charts.js"></script>
<script>
(function(){
  const u = requireAuth(["admin"]); if (!u) return;
  $("#sidebarHost").innerHTML = renderSidebar("analytics"); attachSidebarEvents();

  const p = DATA_ANALYTICS.platform;

  // Stat cards
  const orders = DS.orders();
  const todayOrders = orders.filter(o => String(o.date).slice(0,10) === todayStr()).length;
  $("#statCards").innerHTML = `
    <div class="stat-card green fade-up"><span class="ic">👥</span><div class="label">Total users</div><div class="value">${fmtNum(p.total_users || 8420)}</div><div class="delta up">+128 this week</div></div>
    <div class="stat-card orange fade-up"><span class="ic">🏪</span><div class="label">Total shops</div><div class="value">${fmtNum(DATA_STORES.length)}</div><div class="delta up">${DATA_STORES.filter(s => (s.status||"active")==="active").length} active</div></div>
    <div class="stat-card blue fade-up"><span class="ic">📦</span><div class="label">Total products</div><div class="value">${fmtNum(DATA_PRODUCTS.length)}</div><div class="delta">across 18 categories</div></div>
    <div class="stat-card violet fade-up"><span class="ic">📅</span><div class="label">Orders today</div><div class="value">${fmtNum(p.orders_today || todayOrders)}</div><div class="delta up">+12% vs yesterday</div></div>`;

  // Charts — convert seed data shape ({name,value}) into labels/values
  const labels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  renderDualLine($("#dualLine"), labels, p.new_customers_per_day || p.new_registrations?.customers || [12,18,14,21,17,26,23], "Customers", p.new_shopkeepers_per_day || p.new_registrations?.shopkeepers || [1,0,2,1,1,3,2], "Shopkeepers");

  // Category share — handle either array of {name,value} or labels/data shape
  const catLabels = (p.category_share || []).map(c => c.name) || p.category_popularity?.labels;
  const catValues = (p.category_share || []).map(c => c.value) || p.category_popularity?.data;
  renderDoughnut($("#catDoughnut"), catLabels, catValues);

  // Revenue per week — array OR {labels, data}
  const revData   = Array.isArray(p.revenue_per_week) ? p.revenue_per_week : (p.revenue_per_week?.data || []);
  const revLabels = Array.isArray(p.revenue_per_week) ? p.revenue_per_week.map((_,i)=>"W"+(i+1)) : (p.revenue_per_week?.labels || []);
  renderBarChart($("#revBar"), revLabels, revData, "Revenue", "#16a34a");

  // Funnel — array of {step, count} OR {labels, data}
  const funnelLabels = Array.isArray(p.funnel) ? p.funnel.map(f => f.step) : (p.funnel?.labels || []);
  const funnelData   = Array.isArray(p.funnel) ? p.funnel.map(f => f.count) : (p.funnel?.data || []);
  renderHBar($("#funnelBar"), funnelLabels, funnelData, "Users");

  // Tables
  const searched = p.most_searched || [];
  $("#searchedBody").innerHTML = searched.map((s, i) => `<tr>
    <td><span class="font-serif" style="font-size:1.1rem;font-weight:700;color:${i<3?"var(--orange-500)":"var(--text-3)"}">#${i+1}</span></td>
    <td><strong>${escHTML(s.term || s.keyword)}</strong></td>
    <td>${fmtNum(s.count)}</td>
  </tr>`).join("");

  const locs = p.most_active_areas || p.most_active_locations || [];
  $("#locBody").innerHTML = locs.map((l, i) => `<tr>
    <td><span class="font-serif" style="font-size:1.1rem;font-weight:700;color:${i<3?"var(--orange-500)":"var(--text-3)"}">#${i+1}</span></td>
    <td><strong>📍 ${escHTML(l.name || l.area)}</strong></td>
    <td>${fmtNum(l.activity)}</td>
  </tr>`).join("");
})();
</script>
</body>
</html>
